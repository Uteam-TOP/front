<div class="tag" [ngClass]="{ 'with-competence-level': tag.competenceLevel }">
  <p class="tagText">
    {{tag.name}}
  </p>
  @if (tag.competenceLevel) {
    <p [ngStyle]="{ 'background': getTagColor(tag.competenceLevel) }" class="tag-level">
      {{ getTagText(tag.competenceLevel) }}
    </p>
  }
</div>
