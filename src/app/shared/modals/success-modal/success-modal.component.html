<div class="popup">
  <span class="close" (click)="closePopupSuccess()">&times;</span>
  <div class="popup-content">
    <p id="title">
      {{data.title}}
    </p>
    @if (data.text) {
      <p>
        {{data.text}}
      </p>
    }
    <div class="popup-buttons">
      <ui-button [type]="'grey'" [size]="'large'" (click)="closePopupSuccess()">Закрыть</ui-button>
    </div>
  </div>
</div>
