<div class="label">
  Команды:
</div>
<div class="container">
  @if (projects(); as projects) {
    @if (projects.length) {
      @for (item of projects; track item) {
        <app-commands-item [item]="item" [routerLink]="['/project', item.project.nickname]"></app-commands-item>
      }
    } @else {
      <p>Пока нет команд</p>
    }

  }
</div>
