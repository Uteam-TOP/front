<div class="label">
  Команды:
</div>
<div class="container">
  @if (projects(); as projects) {
    @if (projects.length) {
      @for (item of projects; track item) {
        @if (item.hackathonProjectStatus === 'APPROVED') {
          <app-commands-item [item]="item.project"></app-commands-item>
        }

      }
    } @else {
      <p>Пока нет команд</p>
    }

  }
</div>
