<div class="toggle-switch">
    <button class="toggle-btn" routerLink="/projects" [class.active]="homeService.typeToggle === 'project'" (click)="toggle('project')">
      Проекты
    </button>
    <button class="toggle-btn" routerLink="/vacancies" [class.active]="homeService.typeToggle === 'vacancy'" (click)="toggle('vacancy')">
       Вакансии
    </button>
    <button class="toggle-btn" routerLink="/resumes" [class.active]="homeService.typeToggle === 'resume'" (click)="toggle('resume')">
      Резюме
    </button>
    <button class="toggle-btn" routerLink="/hackathons"  [class.active]="homeService.typeToggle === 'hackathon'" (click)="toggle('hackathon')">
      События
    </button>

</div>
