<div class="content">
  @if (showTypes && !tokenService.getToken()) {
    <app-desktop-type class="desktop-only"></app-desktop-type>
  }
  @if (showTypes && !tokenService.getToken()) {
    <app-phone-type class="phone-only"></app-phone-type>
  }

  <div class="search" [ngClass]="{'sticky-background': settingHeaderService.isSticky}">
    <div class="search-container">
      <app-search ></app-search>
    </div>
  </div>
</div>
