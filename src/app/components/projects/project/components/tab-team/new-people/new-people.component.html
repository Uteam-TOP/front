<div class="team">
  <div class="container-title">
    <p class="subtitle16caps" style="    color: var(--font-color);">новые заявки</p>
  </div>
  <div class="team_people">
    @if (cardItems(); as cardItems) {
      @if (cardItems.length > 0) {
        @for (item of cardItems; track item) {
          <app-item-new-people [item]="item"></app-item-new-people>
        }
      } @else {
        <p class="no-requests" style="margin-left: 22px;     color: var(--font-color);">Нет новых заявок в команду</p>
      }
    }

  </div>
</div>
