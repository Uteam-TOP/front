<div class="main">
  <div class="text-background">
    {{content.numError}}
  </div>
  <div class="container" [ngStyle]="{'background': content.Bgimg}">
    <!-- <div class="img">
    <img src="assets/error/ups.png" alt="Image">
    <div class="text-img">Упс...</div>
  </div> -->
  <div class="content">
    <div class="text">
      <p class="title">
        {{ content.title }}
      </p>

      <p class="subtitle">
        {{ content.subtitle }}
      </p>
    </div>
    <div class="btn">
      @switch (content.btn) {
        @case ('главная') {
          <a class="link" href="">На главную</a>
        }
        @case ('ок') {
          <a class="link" href="">Ок</a>
        }
        @default {
          <a class="link" routerLink="/support">Написать в тех. поддержку</a>
        }
      }


    </div>
